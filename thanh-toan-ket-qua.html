<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả thanh toán - FIT AND CARE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:var(--gray-bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .result-card{background:#fff;max-width:440px;width:100%;border-radius:20px;box-shadow:var(--shadow-soft);padding:40px 32px;text-align:center;}
  .result-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .result-icon.success{background:rgba(76,175,80,0.14);color:var(--green);}
  .result-icon.fail{background:rgba(217,45,32,0.12);color:#D92D20;}
  .result-card h1{font-size:22px;margin-bottom:10px;}
  .result-card p{color:var(--muted);font-size:14px;margin-bottom:6px;}
  .result-order{font-family:var(--font-head);color:var(--navy);font-size:16px;margin:14px 0 22px;}
  .result-actions{display:flex;flex-direction:column;gap:10px;}
</style>
</head>
<body>
  <div class="result-card">
    <div class="result-icon" id="icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" id="iconSvg"></svg>
    </div>
    <h1 id="title">Đang kiểm tra...</h1>
    <p id="desc"></p>
    <div class="result-order" id="orderLine"></div>
    <div class="result-actions">
      <a href="/#lien-he" class="btn btn-primary btn-block">Về trang chủ</a>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const status = params.get('status');
  const orderId = params.get('orderId');
  const icon = document.getElementById('icon');
  const iconSvg = document.getElementById('iconSvg');
  const title = document.getElementById('title');
  const desc = document.getElementById('desc');
  const orderLine = document.getElementById('orderLine');

  if (status === 'success') {
    icon.classList.add('success');
    iconSvg.innerHTML = '<path d="M20 6L9 17l-5-5"/>';
    title.textContent = 'Thanh toán thành công!';
    desc.textContent = 'Cảm ơn bạn đã đăng ký. Đội ngũ FIT AND CARE sẽ liên hệ để kích hoạt gói dịch vụ trong thời gian sớm nhất.';
  } else {
    icon.classList.add('fail');
    iconSvg.innerHTML = '<path d="M18 6L6 18M6 6l12 12"/>';
    title.textContent = 'Thanh toán chưa thành công';
    desc.textContent = 'Giao dịch không hoàn tất hoặc đã bị hủy. Bạn có thể thử lại hoặc liên hệ hotline để được hỗ trợ.';
  }
  if (orderId) orderLine.textContent = 'Mã đơn hàng: ' + orderId;
</script>
</body>
</html>
